services:
  trackii:
    container_name: trackii
    image: ghcr.io/dannyvfilms/trackii
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=longstring
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./db:/trackii/db
    ports:
      - "8000:8000"

  redis:
    container_name: trackii-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
