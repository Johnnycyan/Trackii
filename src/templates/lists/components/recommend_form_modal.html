<div x-data="{ showModal: true }"
     x-show="showModal"
     x-cloak
     class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">
    <div @click.outside="showModal = false"
         class="bg-[#2a2f35] p-6 rounded-lg w-full max-w-md mx-4"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-95">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold">Recommend Item</h3>
            <button @click="showModal = false"
                    class="text-gray-400 hover:text-white transition-colors cursor-pointer">
                {% include "app/icons/x.svg" with classes="w-5 h-5" %}
            </button>
        </div>

        <div class="flex gap-4 mb-6">
            <div class="w-20 h-28 flex-shrink-0">
                <img src="{{ image }}"
                     alt="{{ title }}"
                     class="w-full h-full object-cover rounded-md bg-[#3e454d]">
            </div>
            <div>
                <h4 class="font-medium text-white">{{ title }}</h4>
                <p class="text-sm text-gray-400">{{ media_type|title }}</p>
            </div>
        </div>

        <form method="post"
              action="{% url 'submit_recommendation' custom_list.id %}"
              class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="media_id" value="{{ media_id }}">
            <input type="hidden" name="media_type" value="{{ media_type }}">
            <input type="hidden" name="source" value="{{ source }}">

            {% if not is_authenticated %}
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Your Name (optional)</label>
                    <input type="text"
                           name="anonymous_name"
                           placeholder="Anonymous"
                           maxlength="100"
                           class="w-full py-2 px-3 bg-[#39404b] rounded-md text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-600">
                    <p class="text-xs text-gray-500 mt-1">Leave blank to appear as "Anonymous"</p>
                </div>
            {% else %}
                <div class="bg-[#39404b] rounded-md p-3">
                    <p class="text-sm text-gray-300">
                        Recommending as <span class="font-medium text-white">{{ request.user.username }}</span>
                    </p>
                </div>
            {% endif %}

            <div class="flex gap-3 pt-2">
                <button type="button"
                        @click="showModal = false"
                        class="flex-1 px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-md transition-colors cursor-pointer">
                    Cancel
                </button>
                <button type="submit"
                        class="flex-1 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md transition-colors cursor-pointer flex items-center justify-center gap-2">
                    {% include "app/icons/plus.svg" with classes="w-4 h-4" %}
                    Submit
                </button>
            </div>
        </form>
    </div>
</div>
