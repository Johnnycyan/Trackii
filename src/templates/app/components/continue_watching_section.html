{% load app_tags %}

{% if watching_sessions %}

        <h2 class="text-xl font-semibold mb-2 sm:mb-4">Continue Watching</h2>
        <div class="media-grid">
            {% for session in watching_sessions %}

            {% endfor %}
        </div>
    </div>
{% endif %}
